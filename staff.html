<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>店家後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body style="padding-bottom:40px">
<div class="top"><div class="top-in">
  <div class="brand" id="brand">店家後台</div>
  <div class="who" id="who" hidden><span id="whoName"></span><button class="btn sm sec" type="button" id="logout">登出</button></div>
</div></div>

<div class="wrap">
  <form id="login" class="login" hidden>
    <h1>員工登入</h1>
    <div class="field"><label for="staff">選擇員工</label><select class="inp" id="staff" required></select></div>
    <div class="field"><label for="pw">密碼</label><input class="inp" id="pw" type="password" inputmode="numeric" autocomplete="current-password" required></div>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn" type="submit">登入</button>
  </form>
  <div id="banner" class="banner" hidden></div>
  <section id="view-staff" class="staff" aria-label="店家後台" hidden></section>
</div>

<script type="module">
import { doc, collection, query, where, onSnapshot, runTransaction, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { app, fs, AGE, STATUS, today, pad, esc, $, bowls, active, DEFAULT_SETTINGS } from "./common.js";
import { MENU, SHOP_NAME, STAFF } from "./firebase-config.js";

const auth = getAuth(app);
let DAY = today();
let orders = [], settings = { ...DEFAULT_SETTINGS }, sound = false, prevNew = null, unsubs = [];
$("#brand").textContent = SHOP_NAME + "・後台";

const PW_SUFFIX = "#stb";
$("#staff").innerHTML = '<option value="" disabled selected>請選擇</option>' + STAFF.map((x, i) => `<option value="${i}">${esc(x.name)}</option>`).join("");
$("#login").addEventListener("submit", async (e) => {
  e.preventDefault(); $("#loginErr").textContent = "";
  const st = STAFF[Number($("#staff").value)];
  if (!st) { $("#loginErr").textContent = "請先選擇員工。"; return; }
  // Firebase 密碼至少 6 碼，所以實際密碼 = 輸入的密碼 + PW_SUFFIX
  const pw = $("#pw").value;
  // 員工只要輸入短密碼（例如 123）；不小心連 #stb 一起打也照樣能登入
  const tries = pw.endsWith(PW_SUFFIX) ? [pw] : [pw + PW_SUFFIX, pw];
  let last = null;
  for (const t of tries) {
    if (t.length < 6) continue;
    try { await signInWithEmailAndPassword(auth, st.email, t); return; } catch (ex) { last = ex; }
  }
  const code = (last && last.code) || "";
  const why = {
    "auth/invalid-credential": "員工或密碼不對，或 Firebase 裡還沒建立這個員工帳號",
    "auth/wrong-password": "密碼不對",
    "auth/user-not-found": "Firebase 裡還沒建立這個員工帳號",
    "auth/operation-not-allowed": "Firebase 還沒開啟「電子郵件/密碼」登入方式",
    "auth/unauthorized-domain": "Firebase「已授權的網域」還沒加入這個網站",
    "auth/too-many-requests": "嘗試太多次，請稍等幾分鐘再試",
    "auth/network-request-failed": "網路連不上，請檢查網路",
    "auth/invalid-api-key": "firebase-config.js 的 apiKey 不對"
  }[code] || "請確認員工和密碼";
  $("#loginErr").textContent = "登入失敗：" + why + (code ? `（${code}）` : "");
});
$("#logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, (u) => {
  unsubs.forEach((f) => f()); unsubs = [];
  $("#login").hidden = !!u; $("#who").hidden = !u; $("#view-staff").hidden = !u; $("#banner").hidden = true;
  if (!u) return;
  const me = STAFF.find((x) => x.email === (u.email || "").toLowerCase());
  $("#whoName").textContent = me ? me.name : u.email;
  start();
});

function start() {
  DAY = today();
  const fail = () => { $("#banner").hidden = false; $("#banner").textContent = "讀不到訂單：這個帳號可能沒有後台權限（請確認已加進 firestore.rules 的員工名單）。"; };
  unsubs.push(onSnapshot(query(collection(fs, "orders"), where("day", "==", DAY)), (snap) => {
    orders = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.serial - b.serial);
    watchNew(); render();
  }, fail));
  unsubs.push(onSnapshot(doc(fs, "settings", "main"), (s) => { settings = { ...DEFAULT_SETTINGS, ...(s.exists() ? s.data() : {}) }; render(); }, () => {}));
}

async function setStatus(id, status) {
  const oRef = doc(fs, "orders", id), cRef = doc(fs, "counters", DAY);
  await runTransaction(fs, async (tx) => {
    const os = await tx.get(oRef); if (!os.exists()) return;
    const o = os.data();
    tx.update(oRef, { status, updatedAt: new Date() });
    // 從「待處理/製作中」離開（完成或取消）時，把這單的碗數算進已出餐，讓顧客端的等待時間往前推
    if (active(o) && !active({ status })) tx.update(cRef, { bowlsOut: increment(bowls(o)) });
  });
}
// 親友價：none 原價、half 半價、free 免費。顧客照原價下單，由員工在後台套用
const DISC = { none: "原價", half: "半價", free: "免費" };
const payOf = (o) => o.discount === "free" ? 0 : o.discount === "half" ? Math.round((o.total || 0) / 2) : (o.total || 0);
const setDiscount = (id, d) => updateDoc(doc(fs, "orders", id), { discount: d, updatedAt: new Date() });
const saveSettings = () => setDoc(doc(fs, "settings", "main"), settings).catch(() => {});

const ago = (t) => { const ms = t && t.toMillis ? t.toMillis() : Date.now(); const m = Math.max(0, Math.round((Date.now() - ms) / 60000)); return m < 1 ? "剛剛" : m + " 分鐘前"; };
function card(o) {
  const items = MENU.filter((m) => o[m.id] > 0).map((m) => `<li>${esc(m.name)} × ${o[m.id]}</li>`).join("");
  let acts = "";
  if (o.status === "new") acts = `<button class="btn sm" data-act="cooking" data-id="${o.id}">開始製作</button><button class="btn sm bad" data-act="cancelled" data-id="${o.id}">取消</button>`;
  if (o.status === "cooking") acts = `<button class="btn sm" data-act="ready" data-id="${o.id}">完成・叫號</button><button class="btn sm bad" data-act="cancelled" data-id="${o.id}">取消</button>`;
  if (o.status === "ready") acts = `<button class="btn sm" data-act="done" data-id="${o.id}">已取餐</button>`;
  const d = o.discount || "none";
  const price = d === "none" ? `$${o.total}` : `<s>$${o.total}</s> <b style="color:var(--ok)">$${payOf(o)}・親友${DISC[d]}</b>`;
  const disc = o.status === "cancelled" ? "" : `<div class="acts" role="group" aria-label="親友價">${Object.keys(DISC).map((k) => `<button class="tog" type="button" data-disc="${k}" data-id="${o.id}" aria-pressed="${d === k}">${DISC[k]}</button>`).join("")}</div>`;
  return `<article class="job"><div class="job-h"><span class="no">${pad(o.serial)}</span><span class="meta">${ago(o.createdAt)}・${price}</span></div>` +
    `<ul>${items}</ul><div class="meta">${esc(o.nick)}・${esc(o.age)}</div>` +
    (o.note ? `<div class="note">備註：${esc(o.note)}</div>` : "") + disc + `<div class="acts">${acts}</div></article>`;
}

function render() {
  const el = $("#view-staff"); if (el.hidden) return;
  const live = orders.filter((o) => o.status !== "cancelled");
  const nb = live.reduce((s, o) => s + bowls(o), 0), rev = live.reduce((s, o) => s + payOf(o), 0);
  const friends = live.filter((o) => o.discount === "half" || o.discount === "free"), saved = friends.reduce((s, o) => s + (o.total || 0) - payOf(o), 0);
  const by = (s) => orders.filter((o) => o.status === s);
  const col = (title, list, empty) => `<div class="col"><h2><span>${title}</span><span>${list.length}</span></h2><div class="list">${list.length ? list.map(card).join("") : `<div class="empty">${empty}</div>`}</div></div>`;
  const counts = Object.fromEntries(AGE.map((a) => [a, 0]));
  live.forEach((o) => { if (counts[o.age] != null) counts[o.age]++; });
  const maxC = Math.max(1, ...AGE.map((a) => counts[a]));
  const ageRows = AGE.map((a) => `<div class="age-r"><span class="l">${a}</span><span class="t"><i style="width:${counts[a] / maxC * 100}%"></i></span><span class="n">${counts[a]} 人</span></div>`).join("");
  const closed = orders.filter((o) => o.status === "done" || o.status === "cancelled").slice().reverse();
  const so = settings.soldOut || {};
  const open = settings.open !== false;
  el.innerHTML =
    `<div class="tiles"><div class="tile"><div class="k">今日訂單</div><div class="v">${live.length}</div></div><div class="tile"><div class="k">賣出碗數</div><div class="v">${nb}</div></div><div class="tile"><div class="k">營業額（實收）</div><div class="v">$${rev}</div></div><div class="tile"><div class="k">親友優惠 ${friends.length} 單</div><div class="v">−$${saved}</div></div></div>` +
    `<div class="cols">${col("待處理", by("new"), "目前沒有新訂單")}${col("製作中", by("cooking"), "目前沒有製作中的餐點")}${col("可取餐", by("ready"), "沒有等待取餐的訂單")}</div>` +
    `<div class="panel"><h2 style="margin:0">現場設定</h2>` +
      `<div class="ctl"><span class="nm">線上點餐</span><button class="tog on" type="button" id="openTog" aria-pressed="${open}">${open ? "接單中（點此暫停）" : "已暫停（點此恢復）"}</button></div>` +
      `<div class="ctl"><span class="nm">每碗製作時間（用來估算等待）</span><div class="stepper"><button type="button" data-set="-1" aria-label="減少一分鐘">−</button><span class="q">${settings.perBowl} 分</span><button type="button" data-set="1" aria-label="增加一分鐘">+</button></div></div>` +
      MENU.map((m) => { const s = !!so[m.id]; return `<div class="ctl"><span class="nm">${esc(m.name)}</span><button class="tog" type="button" data-sold="${m.id}" aria-pressed="${s}">${s ? "已售完（點此恢復）" : "供應中（點此標示售完）"}</button></div>`; }).join("") +
      `<div class="ctl"><span class="nm">新訂單提示音</span><button class="tog on" type="button" id="snd" aria-pressed="${sound}">${sound ? "已開啟" : "已關閉"}</button></div>` +
    `</div>` +
    `<div class="panel"><h2 style="margin:0">今日顧客年齡層（每 5 歲）</h2><div class="age">${ageRows}</div></div>` +
    `<details><summary>已取餐與已取消（${closed.length}）</summary>${closed.map((o) => `<div class="mini"><span>${pad(o.serial)}　${esc(o.nick)}</span><span><span class="pill p-${o.status}">${STATUS[o.status]}</span>　$${payOf(o)}${o.discount && o.discount !== "none" ? "（親友" + DISC[o.discount] + "）" : ""}</span></div>`).join("")}</details>`;
}

function alertBanner() { $("#banner").hidden = false; $("#banner").textContent = "親友價沒有存成功：請確認 Firebase 規則已更新成新版。"; }
function beep() { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .15; o.start(); o.stop(c.currentTime + .25); } catch (e) {} }
function watchNew() {
  const n = orders.filter((o) => o.status === "new").length;
  if (prevNew != null && n > prevNew && sound) beep();
  prevNew = n;
}

$("#view-staff").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.act) { b.disabled = true; setStatus(b.dataset.id, b.dataset.act).catch(() => { b.disabled = false; }); }
  else if (b.dataset.disc) { setDiscount(b.dataset.id, b.dataset.disc).catch(() => alertBanner()); }
  else if (b.dataset.set) { settings.perBowl = Math.max(1, Math.min(15, settings.perBowl + Number(b.dataset.set))); saveSettings(); render(); }
  else if (b.dataset.sold) { settings.soldOut = { ...(settings.soldOut || {}) }; settings.soldOut[b.dataset.sold] = !settings.soldOut[b.dataset.sold]; saveSettings(); render(); }
  else if (b.id === "openTog") { settings.open = !(settings.open !== false); saveSettings(); render(); }
  else if (b.id === "snd") { sound = !sound; if (sound) beep(); render(); }
});

// 每 30 秒刷新「幾分鐘前」；過了午夜自動切到新的一天
setInterval(() => { if (auth.currentUser && today() !== DAY) { unsubs.forEach((f) => f()); unsubs = []; prevNew = null; start(); } render(); }, 30000);
</script>
</body>
</html>

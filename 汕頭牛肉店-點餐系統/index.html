<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>汕頭牛肉店點餐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand" id="brand">汕頭牛肉店</div>
</div></div>

<div class="wrap">
  <div id="closed" class="closed" hidden>目前暫停線上點餐，請直接向店家點餐。</div>
  <div id="banner" class="banner" hidden></div>

  <section id="view-order" class="order-col" aria-label="顧客點餐">
    <div id="ticket" hidden></div>

    <form id="orderForm" novalidate style="display:contents">
      <div id="formBody" class="order-col" style="padding:0;max-width:none;width:100%;margin:0">
        <div class="queue" id="queue">載入中…</div>

        <div>
          <h2>餐點</h2>
          <div class="menu" id="menu"></div>
        </div>

        <div class="field">
          <label for="nick">取餐暱稱<span class="req">必填</span></label>
          <input class="inp" id="nick" maxlength="10" autocomplete="off" placeholder="叫號時一起喊，例如：小美">
        </div>

        <div class="field">
          <label for="age">年齡層<span class="req">必填</span></label>
          <select class="inp" id="age" required></select>
          <span class="hint">僅用來統計客群，不會公開。</span>
        </div>

        <div class="err" id="err" role="alert"></div>
      </div>
    </form>
  </section>
</div>

<div class="bar" id="bar"><div class="bar-in">
  <div class="sum"><span id="sumTxt">尚未選餐</span><b id="sumTotal">$0</b></div>
  <button class="btn" id="submit" type="submit" form="orderForm" disabled>送出訂單</button>
</div></div>

<script type="module">
import { doc, onSnapshot, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { fs, AGE, STATUS, today, pad, esc, $, bowls, active, DEFAULT_SETTINGS } from "./common.js";
import { MENU, PRICE, SHOP_NAME } from "./firebase-config.js";

const DAY = today();
let settings = { ...DEFAULT_SETTINGS }, counter = { serial: 0, bowlsIn: 0, bowlsOut: 0 };
let qty = Object.fromEntries(MENU.map((m) => [m.id, 0]));
let mine = null, unsubMine = null;

document.title = SHOP_NAME + "點餐";
$("#brand").textContent = SHOP_NAME;

const LS = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } };
const queueBowls = () => Math.max(0, (counter.bowlsIn || 0) - (counter.bowlsOut || 0));
const estFor = (ahead, q, min) => Math.max(min, Math.ceil((ahead + q) * settings.perBowl));

function buildForm() {
  $("#age").innerHTML = '<option value="" disabled selected>請選擇年齡層</option>' + AGE.map((a) => `<option value="${a}">${a}</option>`).join("");
  $("#menu").innerHTML = MENU.map((m) =>
    `<div class="item" data-id="${m.id}"><div><div class="nm">${esc(m.name)}</div><div class="pr">$${m.price} <span class="sold-tag" hidden>已售完</span></div></div>` +
    `<div class="stepper"><button type="button" data-d="-1" aria-label="減少一份${esc(m.name)}">−</button><span class="q" aria-live="polite">0</span><button type="button" data-d="1" aria-label="增加一份${esc(m.name)}">+</button></div></div>`
  ).join("");
  $("#menu").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-d]"); if (!b) return;
    const id = b.closest(".item").dataset.id;
    qty[id] = Math.max(0, Math.min(20, qty[id] + Number(b.dataset.d)));
    render();
  });
  $("#orderForm").addEventListener("submit", onSubmit);
}

async function createOrder(p) {
  const q = MENU.reduce((s, m) => s + p[m.id], 0);
  const cRef = doc(fs, "counters", DAY);
  return runTransaction(fs, async (tx) => {
    const cs = await tx.get(cRef);
    const c = cs.exists() ? cs.data() : { serial: 0, bowlsIn: 0, bowlsOut: 0 };
    const serial = (c.serial || 0) + 1;
    const id = DAY + "-" + serial;
    const order = { day: DAY, serial, ...p, total: q * PRICE, bowlsBefore: c.bowlsIn || 0, status: "new", createdAt: serverTimestamp() };
    if (cs.exists()) tx.update(cRef, { serial, bowlsIn: (c.bowlsIn || 0) + q });
    else tx.set(cRef, { serial, bowlsIn: q, bowlsOut: 0 });
    tx.set(doc(fs, "orders", id), order);
    return id;
  });
}

async function onSubmit(e) {
  e.preventDefault();
  const err = $("#err"); err.textContent = "";
  const q = MENU.reduce((s, m) => s + qty[m.id], 0);
  const nick = $("#nick").value.trim(), age = $("#age").value;
  if (!q) { err.textContent = "請先選擇餐點份數。"; return; }
  if (!nick) { err.textContent = "請填寫取餐暱稱。"; $("#nick").focus(); return; }
  if (!age) { err.textContent = "請選擇年齡層。"; $("#age").focus(); return; }
  const btn = $("#submit"); btn.disabled = true; btn.textContent = "送出中…";
  try {
    const p = { nick, dine: "外帶", age, note: "" };
    MENU.forEach((m) => (p[m.id] = qty[m.id]));
    const id = await createOrder(p);
    LS("mine", { day: DAY, id });
    MENU.forEach((m) => (qty[m.id] = 0));
    watchMine(id);
  } catch (ex) {
    console.error(ex);
    err.textContent = "目前無法送出，請直接向店家點餐，或稍後再試。";
  }
  btn.textContent = "送出訂單";
  render();
  window.scrollTo(0, 0);
}

function watchMine(id) {
  if (unsubMine) unsubMine();
  unsubMine = onSnapshot(doc(fs, "orders", id), (s) => {
    mine = s.exists() ? { id: s.id, ...s.data() } : null;
    if (!mine) LS("mine", null);
    render();
  }, () => {});
}

function render() {
  const closed = settings.open === false;
  const showTicket = !!mine;
  $("#closed").hidden = !closed || showTicket;
  $("#ticket").hidden = !showTicket;
  $("#formBody").hidden = showTicket || closed;
  $("#bar").hidden = showTicket || closed;
  if (showTicket) { renderTicket(mine); return; }
  const ahead = queueBowls();
  $("#queue").innerHTML = `目前等候 <b>${ahead}</b> 碗　·　現在點餐約等 <b>${estFor(ahead, 1, 5)}</b> 分鐘`;
  MENU.forEach((m) => {
    const row = document.querySelector(`.item[data-id="${m.id}"]`);
    const sold = !!(settings.soldOut || {})[m.id];
    if (sold) qty[m.id] = 0;
    row.classList.toggle("sold", sold);
    row.querySelector(".sold-tag").hidden = !sold;
    row.querySelector(".q").textContent = qty[m.id];
    row.querySelector('[data-d="1"]').disabled = sold || qty[m.id] >= 20;
    row.querySelector('[data-d="-1"]').disabled = qty[m.id] <= 0;
  });
  const q = MENU.reduce((s, m) => s + qty[m.id], 0);
  $("#sumTotal").textContent = "$" + q * PRICE;
  $("#sumTxt").textContent = q ? `共 ${q} 碗・預計等待約 ${estFor(ahead, q, 5)} 分鐘` : "尚未選餐";
  $("#submit").disabled = !q;
}

function renderTicket(o) {
  const st = o.status;
  const items = MENU.filter((m) => o[m.id] > 0).map((m) => `<div class="row"><span>${esc(m.name)}</span><span>× ${o[m.id]}</span></div>`).join("");
  let wait = "";
  if (active(o)) {
    const ahead = Math.max(0, (o.bowlsBefore || 0) - (counter.bowlsOut || 0));
    const est = Math.max(3, Math.ceil((ahead + bowls(o)) * settings.perBowl));
    wait = `<div class="wait"><div class="k">預計等待</div><b>約 ${est} 分鐘</b><div class="k">前面還有 ${ahead} 碗</div></div>`;
  } else if (st === "ready") {
    wait = `<div class="wait"><b>餐點好了，請到攤位取餐</b><div class="k">取餐序號 ${pad(o.serial)}（${esc(o.nick)}）</div></div>`;
  }
  const msg = { new: "已收到訂單，等待製作", cooking: "正在製作中", ready: "可以取餐了", done: "已取餐，謝謝光臨", cancelled: "此訂單已取消，請洽店家" }[st] || "";
  $("#ticket").innerHTML = `<div class="ticket"><div><div class="k">您的取餐序號</div><div class="no">${pad(o.serial)}</div></div>` +
    `<div><span class="pill p-${st}">${STATUS[st] || ""}</span> <span class="hint">${msg}</span></div>${wait}` +
    `<div>${items}<div class="row"><span>取餐暱稱</span><span>${esc(o.nick)}</span></div>${o.discount === "free" || o.discount === "half" ? `<div class="row"><span>原價</span><span><s>$${o.total}</s></span></div><div class="row"><b>親友${o.discount === "free" ? "免費" : "半價"}・應付</b><b>$${o.discount === "free" ? 0 : Math.round(o.total / 2)}</b></div>` : `<div class="row"><b>合計</b><b>$${o.total}</b></div>`}</div>` +
    `<p class="hint" style="margin:0">請保持此頁開啟，餐點好了畫面會自動更新。</p>` +
    `<button class="btn sec" type="button" id="again">再點一份</button></div>`;
  $("#again").onclick = () => { if (unsubMine) unsubMine(); unsubMine = null; mine = null; LS("mine", null); render(); };
}

buildForm();
render();

onSnapshot(doc(fs, "settings", "main"), (s) => { settings = { ...DEFAULT_SETTINGS, ...(s.exists() ? s.data() : {}) }; render(); },
  () => { $("#banner").hidden = false; $("#banner").textContent = "連不上點餐系統，請直接向店家點餐。"; });
onSnapshot(doc(fs, "counters", DAY), (s) => { counter = s.exists() ? s.data() : { serial: 0, bowlsIn: 0, bowlsOut: 0 }; render(); }, () => {});

const saved = LS("mine");
if (saved && saved.day === DAY && saved.id) watchMine(saved.id);
</script>
</body>
</html>
